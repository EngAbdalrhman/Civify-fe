name: Deploy Dev-Stg Frontend to Dokploy

on:
  push:
    branches: ["Staging"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-frontend-dev-stg

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: stg
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Lowercase Image Name
      - name: Lowercase Image Name
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >>${GITHUB_ENV}

      # 4. Build and push Docker Image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
            NEXT_PUBLIC_CLARITY_PROJECT_ID=${{ vars.NEXT_PUBLIC_CLARITY_PROJECT_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_ADS_ENABLED=${{ vars.NEXT_PUBLIC_ADS_ENABLED }}
            NEXT_TELEMETRY_DISABLED=${{ vars.NEXT_TELEMETRY_DISABLED }}
          # Source maps: create the token at https://de.sentry.io (org civify-2g), not sentry.io (US).
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

      # Runtime in Dokploy (not build-args): SERVER_API_URL=http://<backend>:8080/apis
      # See docs/BLOG_DEPLOY.md

      # 5. Trigger Dokploy to Pull and Deploy
      - name: Trigger Dokploy Deployment
        run: |
          curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_DEV_STG }}" \
            -H "Content-Type: application/json" \
            -d "{\"image\": \"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\"}"

      # Optional Swarm patch over SSH — off by default (store no server SSH key in GitHub).
      # Enable only if needed: GitHub var ENABLE_DOKPLOY_SSH_PATCH=true + SSH secrets.
      # Preferred: set INTERNAL_API_URL in Dokploy (see docs/BLOG_DEPLOY.md).
      - name: Patch frontend Swarm networking (optional SSH)
        if: vars.ENABLE_DOKPLOY_SSH_PATCH == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DOKPLOY_SSH_HOST }}
          username: ${{ secrets.DOKPLOY_SSH_USER }}
          key: ${{ secrets.DOKPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            FRONTEND="${{ vars.DOKPLOY_FRONTEND_SWARM_SERVICE }}"
            BACKEND="${{ vars.DOKPLOY_BACKEND_SWARM_SERVICE }}"
            API_HOST="${{ vars.DOKPLOY_API_HOST }}"
            [ -z "$FRONTEND" ] || [ -z "$BACKEND" ] && exit 1
            [ -z "$API_HOST" ] && API_HOST="stg.civify.cv"
            BACKEND_VIP=$(sudo docker service inspect "$BACKEND" --format '{{range .Endpoint.VirtualIPs}}{{.Addr}}{{"\n"}}{{end}}' | head -1 | cut -d/ -f1)
            sudo docker service update \
              --dns-add 127.0.0.11 \
              --host-add "${API_HOST}:$(getent hosts "$API_HOST" | awk '{print $1}' | head -1)" \
              --host-add "${BACKEND}:${BACKEND_VIP}" \
              "$FRONTEND" || true
