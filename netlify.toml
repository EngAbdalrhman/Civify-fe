# Netlify Configuration for HICv Next.js App

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Redirect API routes to serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Functions configuration
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["canvas", "pdf-parse", "sharp"]

# Apply function settings to all functions
[functions."*"]
  # Increase timeout for AI processing (default is 10 seconds)
  timeout = 60

# Headers for security
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
